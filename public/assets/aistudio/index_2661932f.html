<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADERNETA ON - Início</title>
    <style>
        :root {
            --bg-color: #001219;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00afb9;
            --accent-mint: #94d2bd;
            --b1-color: #9b2226;
            --b2-color: #ee9b00;
            --b3-color: #0a9396;
            --b4-color: #005f73;
            --yellow-ati: #ffff00;
            --yellow-dark: #ccac00;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: radial-gradient(circle at top right, #002d36, #001219); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden;
        }

        h1 { 
            color: var(--accent-cyan); 
            margin-bottom: 5px; 
            font-size: 3.5rem; 
            font-weight: 900; 
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(0, 175, 185, 0.3);
        }

        .select-label { 
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 10px 35px; 
            border-radius: 50px; 
            color: var(--accent-mint); 
            font-weight: 600; 
            font-size: 0.9rem; 
            margin-bottom: 30px; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .grid-bimestres { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-bottom: 30px; 
        }

        .btn-bimestre { 
            width: 260px; 
            padding: 35px 20px; 
            border-radius: 18px; 
            border: 1px solid var(--glass-border); 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: white; 
            cursor: pointer; 
            text-decoration: none; 
            text-align: center; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
            box-sizing: border-box;
        }

        .btn-bimestre:hover, .btn-atividades:hover, .btn-footer:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
            filter: brightness(1.1);
        }

        .b1 { background: linear-gradient(135deg, #660708, var(--b1-color)); border-bottom: 4px solid #660708; }
        .b2 { background: linear-gradient(135deg, #bb3e03, var(--b2-color)); border-bottom: 4px solid #bb3e03; }
        .b3 { background: linear-gradient(135deg, #005f73, var(--b3-color)); border-bottom: 4px solid #005f73; }
        .b4 { background: linear-gradient(135deg, #001219, var(--b4-color)); border-bottom: 4px solid #001219; }

        .footer-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-footer { 
            background: rgba(255, 255, 255, 0.1);
            color: white; 
            padding: 18px 30px; 
            border-radius: 15px; 
            font-size: 0.9rem; 
            font-weight: 700; 
            cursor: pointer; 
            text-decoration: none; 
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(5px);
        }

        .btn-atividades {
            padding: 18px 40px;
            background: linear-gradient(135deg, var(--yellow-dark), var(--yellow-ati));
            color: #001219;
            border-bottom: 4px solid var(--yellow-dark);
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 15px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 255, 0, 0.2);
        }

        @media (max-width: 650px) {
            .grid-bimestres { grid-template-columns: 1fr; }
            .btn-bimestre { width: 85vw; padding: 20px; }
            h1 { font-size: 2.5rem; }
            .footer-nav { flex-direction: column; width: 100%; align-items: center; }
            .btn-footer, .btn-atividades { width: 85vw; text-align: center; }
        }
    </style>
</head>
<body>

    <h1>CADERNETA ON</h1>
    
    <div class="select-label">Painel de Controle</div>

    <div class="grid-bimestres">
        <a href="frequencia.html" class="btn-bimestre b1" onclick="setBimestre('1º')">
            <span style="font-size: 0.7rem; opacity: 0.8; letter-spacing: 2px;">BIMESTRE</span> 1º
        </a>
        <a href="frequencia.html" class="btn-bimestre b2" onclick="setBimestre('2º')">
            <span style="font-size: 0.7rem; opacity: 0.8; letter-spacing: 2px;">BIMESTRE</span> 2º
        </a>
        <a href="frequencia.html" class="btn-bimestre b3" onclick="setBimestre('3º')">
            <span style="font-size: 0.7rem; opacity: 0.8; letter-spacing: 2px;">BIMESTRE</span> 3º
        </a>
        <a href="frequencia.html" class="btn-bimestre b4" onclick="setBimestre('4º')">
            <span style="font-size: 0.7rem; opacity: 0.8; letter-spacing: 2px;">BIMESTRE</span> 4º
        </a>
    </div>

    <div class="footer-nav">
        <a href="turmas-alunos.html" class="btn-footer">Configurações</a>
        <a href="atividades.html" class="btn-atividades">Atividades</a>
    </div>

    <script>
        function setBimestre(valor) {
            localStorage.setItem('bimestre_selecionado', valor);
        }
    </script>

</body>
</html>
